<main class="shell">
  <!-- Picture side: hidden on phones (see the css) -->
  <aside class="art">
    <img [src]="image()" alt="" />
    <h2>{{ headline() }}</h2>
    <p>{{ caption() }}</p>
  </aside>

  <!-- Form side -->
  <section class="panel">
    <div class="box">
      <div class="brand">
        <img src="logo.svg" alt="" width="44" height="44" />
        <strong>MoCourse</strong>
      </div>
      <ng-content />
    </div>
  </section>
</main>
