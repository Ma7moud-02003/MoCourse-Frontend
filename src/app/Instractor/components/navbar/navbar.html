<header class="sticky top-0 z-30 flex h-16 w-full items-center justify-between border-b border-slate-200/80 bg-white/90 px-4 md:px-8 backdrop-blur-md select-none shadow-sm shadow-slate-100">
  
  <!-- الجزء الأيمن: شريط البحث -->
  <div class="flex items-center gap-4">
    <div class="relative w-64 md:w-100">
      <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input
        type="text"
        placeholder="ابحث عن أي شيء..."
        class="w-full rounded-full border
         border-slate-200 bg-slate-50/80  pr-10 pl-4 py-4 text-xs font-medium text-slate-800 placeholder-slate-400 transition-all duration-200 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-4 focus:ring-blue-500/10"
      />
    </div>
  </div>


  <!-- الجزء الأيسر: الأيقونات + بروفايل المستخدم -->
  <div class="flex items-center gap-3 sm:gap-4">
    
    <!-- زر الإشعارات -->
    <button
      type="button"
      class="relative flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200/80 bg-slate-50/50 text-slate-500 transition-all duration-200 hover:bg-slate-100 hover:text-blue-600 active:scale-95"
      aria-label="Notifications"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 01-6 0v-1m6 0H9" />
      </svg>
      <!-- مؤشر وجود إشعارات جديدة -->
      <span class="absolute top-2.5 left-2.5 flex h-2 w-2">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-blue-400 opacity-75"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-blue-600"></span>
      </span>
    </button>

    <!-- فاصل رأسي -->
    <div class="h-8 w-[1px] bg-slate-200/80"></div>

    <!-- بطاقة البروفايل والمستخدم -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleUserMenu()"
        class="flex items-center gap-3 rounded-2xl border border-slate-200/70 bg-slate-50/60 p-1.5 pl-3 transition-all duration-200 hover:bg-slate-100/80 hover:shadow-sm active:scale-98"
      >
        <!-- صورة الصورة الشخصية / Avatar -->
        <div class="relative shrink-0">
          <img
            [src]="avatar() || 'https://ui-avatars.com/api/?name=' + fullName() + '&background=2563eb&color=ffffff&bold=true'"
            [alt]="fullName()"
            class="h-9 w-9 rounded-xl object-cover ring-2 ring-blue-500/20"
          />
          <span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-white bg-emerald-500"></span>
        </div>

        <!-- معلومات الاسم والرتبة -->
        <div class="hidden flex-col text-right leading-tight sm:flex">
          <span class="truncate text-xs font-bold text-slate-900">{{ fullName() }}</span>
          <span class="truncate text-[10px] font-medium text-slate-500">{{ role() }}</span>
        </div>

        <!-- سهم القائمة -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4 text-slate-400 transition-transform duration-200"
          [class.rotate-180]="isMenuOpen()"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- القائمة المنسدلة للبروفايل (Dropdown Menu) -->
      @if (isMenuOpen()) {
        <div class="absolute left-0 mt-2 w-64 rounded-2xl border border-slate-200/80 bg-white p-2 shadow-xl shadow-slate-200/60 animate-in fade-in slide-in-from-top-2 duration-200 z-50">
          <!-- تفاصيل الحساب داخل القائمة -->
          <div class="border-b border-slate-100 p-3 text-right">
            <p class="truncate text-sm font-bold text-slate-900">{{ fullName() }}</p>
            <p class="truncate text-xs text-slate-500 mt-0.5">{{ email() }}</p>
            <span class="mt-2 inline-block rounded-lg bg-blue-50 px-2 py-0.5 text-[10px] font-bold text-blue-600">
              {{ role() }}
            </span>
          </div>

          <!-- خيارات القائمة -->
          <div class="mt-1 space-y-0.5">
            <button
              type="button"
              class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-right text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              الملف الشخصي
            </button>

            <button
              type="button"
              class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-right text-xs font-semibold text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              الإعدادات
            </button>

            <div class="my-1 border-t border-slate-100"></div>

            <button
              type="button"
              (click)="logout()"
              class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-right text-xs font-semibold text-red-600 hover:bg-red-50 transition-colors"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              تسجيل الخروج
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
