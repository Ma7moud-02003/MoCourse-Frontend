<div class="no-scrollbar min-h-screen bg-slate-50 flex flex-col dir-rtl" dir="rtl">

 
    <app-sidebar 
    [isCollapsed]="isSidebarCollapsed()" 
    (toggle)="toggleSidebar()">
  </app-sidebar>


  <!-- الجزء الأيسر الكامل (النافبار + المحتوى الرئيسي) -->
  <div 
    [class.mr-50]="!isSidebarCollapsed()"
    [class.mr-20]="isSidebarCollapsed()"
    class="flex flex-col flex-1 transition-all duration-300 ease-in-out"
  >
    <!-- الشريط العلوي (Navbar) -->
    <app-navbar 
      [fullName]="userInfo()?.fullName || ''" 
      [email]="userInfo()?.email || ''" 
      [role]="userInfo()?.role || ''" 
      [avatar]="userInfo()?.avatar || ''">
    </app-navbar>

    <!-- المحتوى الرئيسي (Main Content) -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
