<!-- Container الشريط الجانبي ثابت على اليمين بمظهر فاتح واحترافي -->
<aside
 
  [class.w-50]="!isCollapsed()"
  [class.w-20]="isCollapsed()"
  class="fixed no-scrollbar top-0 right-0 z-50 flex h-screen select-none flex-col justify-between border-l border-gray-100 bg-slate-50/60 text-slate-700 shadow-sm transition-all duration-300 ease-in-out backdrop-blur-md"
>
  <!-- زر الفتح والإغلاق -->
  <button
    type="button"
    (click)="toggleSidebar()"
    aria-label="Toggle Sidebar"
    class="absolute -left-3.5 top-7 z-10 flex h-7 w-7 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 shadow-md transition-all duration-200 hover:scale-110 hover:bg-purple-50 hover:text-purple-600 focus:outline-none"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4 transition-transform duration-300"
      [class.rotate-180]="isCollapsed()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
    </svg>
  </button>

  <!-- الجزء العلوي: اللوجو + القائمة -->
  <div class="no-scrollbar flex-1 overflow-y-auto px-3.5 py-6">
    
    <!-- اللوجو والهوية التجارية -->
    <div class="mb-7 px-2 flex items-center justify-between" [class.justify-center]="isCollapsed()">
      @if (!isCollapsed()) {
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-purple-600 text-white shadow-md shadow-purple-500/20">
            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM3.89 9L12 4.57 20.11 9 12 13.43 3.89 9zM12 16c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <span class="logo text-2xl font-black tracking-tight text-slate-900">
            Mo-Course
          </span>
        </div>
      } @else {
        <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-purple-600 text-white shadow-md shadow-purple-500/20">
          <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
          </svg>
        </div>
      }
    </div>

   
   

    <!-- عناصر التنقل الرئيسية -->
    <nav class="space-y-2.5 ">
      @for (item of mainNavItems; track item.id) {
        <button 
          type="button"
          [routerLink]="item.path"
          routerLinkActive="bg-purple-600 text-white font-bold shadow-md shadow-purple-500/25 active-nav"
          (click)="setActive(item.id)"
                 [ngClass]="{
          'bg-purple-600 text-white font-bold shadow-md shadow-purple-500/25': activeId() === item.id}"
          class=" relative flex w-full items-center gap-3.5 rounded-2xl px-4 py-3 text-sm text-right transition-all duration-200"
        >
         <i class="{{item.icon}}"></i>

          @if (!isCollapsed()) {
            <span class="truncate text-xs font-bold tracking-wide">
                  
              {{ item.label }}
            </span>
          }

          <!-- Tooltip عند طي الشريط الجانبي -->
          @if (isCollapsed()) {
            <div class="pointer-events-none absolute right-full top-1/2 z-50 mr-3.5 -translate-y-1/2 whitespace-nowrap rounded-xl bg-slate-900 px-3 py-1.5 text-xs font-semibold text-black opacity-0 shadow-xl transition-all duration-200 group-hover:opacity-100">
              {{ item.label }}
            </div>
          }
        </button>
      }
    </nav>
  </div>

  <!-- الجزء السفلي: خيارات الحساب وتسجيل الخروج -->
  <div class="space-y-2 border-t border-gray-100/80 p-3.5">
    @for (item of accountNavItems; track item.id) {
      <button 
        type="button"
        [routerLink]="item.path"
        routerLinkActive="bg-purple-600 text-slate-800 font-bold shadow-md shadow-purple-500/25 active-nav"
        #rlaAcc="routerLinkActive"
        (click)="setActive(item.id)"
        [ngClass]="{
          'justify-center': isCollapsed(),
          'bg-purple-600 text-white font-bold shadow-md shadow-purple-500/25': activeId() === item.id,
          'bg-white/80 text-slate-700 hover:bg-white hover:shadow-xs border border-gray-100/80': activeId() !== item.id
        }"
        class="group relative flex w-full text-slate-500 items-center gap-3.5 rounded-2xl px-4 py-3 text-right transition-all duration-200"
      >
       <i class="{{item.icon}}"></i>
          
       

        @if (!isCollapsed()) {
          <span class="truncate text-sm font-semibold tracking-wide">
                
            {{ item.label }}
          </span>
        }

        @if (isCollapsed()) {
          <div class="pointer-events-none absolute right-full top-1/2 z-50 mr-3.5 -translate-y-1/2 whitespace-nowrap rounded-xl bg-slate-900 px-3 py-1.5 text-xs font-semibold text-slate-800 opacity-0 shadow-xl transition-all duration-200 group-hover:opacity-100">
            {{ item.label }}
          </div>
        }
      </button>
    }

    <!-- زر تسجيل الخروج -->
    <button
      type="button"
      (click)="logout()"
      [class.justify-center]="isCollapsed()"
      class="group relative flex w-full items-center gap-3.5 rounded-2xl border border-red-100/50 bg-red-50/50 px-4 py-3 text-right text-red-600 transition-all duration-200 hover:bg-red-50 hover:text-red-700 hover:shadow-xs"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 shrink-0 text-red-500 transition-transform duration-200 group-hover:scale-105"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
        />
      </svg>

      @if (!isCollapsed()) {
        <span class="truncate text-sm font-semibold">
          تسجيل الخروج
        </span>
      }

      @if (isCollapsed()) {
        <div class="pointer-events-none absolute right-full top-1/2 z-50 mr-3.5 -translate-y-1/2 whitespace-nowrap rounded-xl bg-slate-900 px-3 py-1.5 text-xs font-semibold text-black opacity-0 shadow-xl transition-all duration-200 group-hover:opacity-100">
          تسجيل الخروج
        </div>
      }
    </button>
  </div>
</aside>
