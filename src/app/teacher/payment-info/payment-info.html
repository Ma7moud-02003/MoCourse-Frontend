<div class="flex min-h-dvh flex-col">
  <app-header />

  <main class="mx-auto w-full max-w-[860px] flex-1 px-5 pb-16">
    <a
      routerLink="/teacher"
      class="mt-5 inline-flex items-center gap-2 rounded-full border border-line bg-white px-3.5 py-2 text-[13px] font-medium text-ink transition-colors hover:border-plum/40 hover:text-plum"
    >
      رجوع للرئيسية
    </a>

    <section class="mt-4 rounded-[22px] border border-line bg-white p-5 md:p-6">
      <h2 class="text-[17px] font-bold">بيانات الدفع</h2>
      <p class="mt-1 text-[13.5px] leading-7 text-muted">
        الأرقام دي بتظهر للطالب في صفحة الكورس عشان يحوّل عليها. اكتب اللي بتستخدمه بس، وسيب الباقي
        فاضي.
      </p>

      <div class="mt-4 grid gap-3 md:grid-cols-2">
        <label class="block">
          <span class="text-[13px] font-medium">اسم صاحب الحساب</span>
          <input
            type="text"
            [value]="form().ownerName"
            (input)="setField('ownerName', $any($event.target).value)"
            placeholder="مثال: كريم عادل"
            class="mt-1.5 w-full rounded-xl border-[1.5px] border-line bg-white px-3.5 py-2.5 text-[14px] outline-none placeholder:text-muted/70 focus:border-plum"
          />
        </label>

        <label class="block">
          <span class="text-[13px] font-medium">إنستاباي</span>
          <input
            type="text"
            dir="ltr"
            [value]="form().instapay"
            (input)="setField('instapay', $any($event.target).value)"
            placeholder="example@instapay"
            class="mt-1.5 w-full rounded-xl border-[1.5px] border-line bg-white px-3.5 py-2.5 text-[14px] outline-none placeholder:text-muted/70 focus:border-plum"
          />
        </label>

        <label class="block">
          <span class="text-[13px] font-medium">فودافون كاش</span>
          <input
            type="tel"
            dir="ltr"
            [value]="form().vodafoneCash"
            (input)="setField('vodafoneCash', $any($event.target).value)"
            placeholder="01xxxxxxxxx"
            class="mt-1.5 w-full rounded-xl border-[1.5px] border-line bg-white px-3.5 py-2.5 text-[14px] outline-none placeholder:text-muted/70 focus:border-plum"
          />
        </label>

        <label class="block">
          <span class="text-[13px] font-medium">أورنج كاش</span>
          <input
            type="tel"
            dir="ltr"
            [value]="form().orangeCash"
            (input)="setField('orangeCash', $any($event.target).value)"
            placeholder="01xxxxxxxxx"
            class="mt-1.5 w-full rounded-xl border-[1.5px] border-line bg-white px-3.5 py-2.5 text-[14px] outline-none placeholder:text-muted/70 focus:border-plum"
          />
        </label>

        <label class="block md:col-span-2">
          <span class="text-[13px] font-medium">حساب بنكي</span>
          <input
            type="text"
            dir="ltr"
            [value]="form().bankAccount"
            (input)="setField('bankAccount', $any($event.target).value)"
            placeholder="رقم الحساب أو IBAN"
            class="mt-1.5 w-full rounded-xl border-[1.5px] border-line bg-white px-3.5 py-2.5 text-[14px] outline-none placeholder:text-muted/70 focus:border-plum"
          />
        </label>
      </div>

      @if (paymentNote()) {
        <p class="mt-3 rounded-xl bg-alert-bg px-4 py-3 text-[13px] leading-7 text-alert-ink">
          {{ paymentNote() }}
        </p>
      }

      @if (paymentSaved()) {
        <p class="mt-3 rounded-xl bg-mint-light px-4 py-3 text-[13px] leading-7 text-mint">
          تم الحفظ. الأرقام دي هتظهر للطالب في صفحة الكورس.
        </p>
      }

      <button
        type="button"
        (click)="savePaymentInfo()"
        [disabled]="paymentSaving()"
        class="mt-4 cursor-pointer rounded-full bg-plum px-6 py-2.5 text-[14px] font-semibold text-white transition-colors hover:bg-plum-dark disabled:opacity-60"
      >
        {{ paymentSaving() ? 'بنحفظ...' : 'احفظ بيانات الدفع' }}
      </button>
    </section>
  </main>

  <app-footer />
  </div>
